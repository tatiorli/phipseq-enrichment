name: build-and-publish-image

# Builds docker/Dockerfile on every push to main and publishes the image to
# the GitHub Container Registry, public, at:
#
#   ghcr.io/<owner>/phipseq-enrichment:latest
#
# No docker login, no personal token: GitHub issues a scoped token to the job.
# This is why the image never has to be pushed by hand from the cluster.

on:
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - '.github/workflows/docker-image.yml'
  workflow_dispatch:        # lets you trigger it manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # required to publish to ghcr.io

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive lowercase image name
        id: img
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          file: ./docker/Dockerfile
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the published image
        run: |
          docker run --rm ${{ steps.img.outputs.name }}:latest bash -c \
            '$PY_BIN/streme --version && $R_BIN/Rscript -e "cat(R.version.string)"'
